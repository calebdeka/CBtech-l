<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CB@Techno - Gestionnaire</title>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, query, onSnapshot, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAtTog9eMM3acErQeTf6K2gGrMcY3HBSnE",
            authDomain: "cbtech-database.firebaseapp.com",
            projectId: "cbtech-database",
            storageBucket: "cbtech-database.firebasestorage.app",
            messagingSenderId: "433087349101",
            appId: "1:433087349101:web:ee238334fd40ba2ab71a64"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const storage = getStorage(app);

        // --- FONCTION PUBLICATION (POUR TOI) ---
        window.publierArticle = async () => {
            const pass = prompt("Code propriétaire :");
            if (pass !== "Caleb.1997") return alert("Accès refusé");

            const file = document.getElementById('file').files[0];
            const nom = document.getElementById('nom').value;
            const desc = document.getElementById('desc').value;
            const prixN = document.getElementById('prixN').value;
            const prixR = document.getElementById('prixR').value;

            if(!file || !nom || !prixR) return alert("Remplis les champs importants !");

            const storageRef = ref(storage, 'articles/' + file.name);
            await uploadBytes(storageRef, file);
            const url = await getDownloadURL(storageRef);

            await addDoc(collection(db, "articles"), {
                nom, desc, prixN, prixR, url, date: Date.now()
            });
            alert("Article publié avec succès !");
        };

        // --- AFFICHAGE CLIENT ---
        const container = document.getElementById('catalogue');
        onSnapshot(query(collection(db, "articles"), orderBy("date", "desc")), (snap) => {
            container.innerHTML = "";
            snap.forEach(doc => {
                const d = doc.data();
                container.innerHTML += `
                    <div style="border:1px solid #ddd; margin:10px; padding:15px; border-radius:10px;">
                        <img src="${d.url}" style="width:100%; border-radius:5px;">
                        <h3>${d.nom}</h3>
                        <p>${d.desc}</p>
                        <p><del>${d.prixN} CFA</del> <b style="color:red;">${d.prixR} CFA</b></p>
                        <a href="https://wa.me/22870062639?text=Salut Caleb, je veux : ${d.nom}" 
                           style="background:#25D366; color:white; padding:10px; display:block; text-align:center; text-decoration:none; border-radius:5px;">
                           Commander sur WhatsApp
                        </a>
                    </div>`;
            });
        });
    </script>
</head>
<body style="font-family:sans-serif; max-width:600px; margin:auto; background:#f4f4f4;">

    <header style="background:#000; color:white; padding:20px; text-align:center;">
        <h1>CB@Techno</h1>
        <button onclick="document.getElementById('admin').style.display='block'" style="background:none; border:none; color:#333; font-size:10px;">Admin</button>
    </header>

    <div id="admin" style="display:none; background:white; padding:20px; border-bottom:2px solid #007bff;">
        <input type="file" id="file" accept="image/*,video/*"><br><br>
        <input type="text" id="nom" placeholder="Nom de l'article" style="width:100%"><br><br>
        <textarea id="desc" placeholder="Caractéristiques" style="width:100%"></textarea><br><br>
        <input type="number" id="prixN" placeholder="Prix Normal" style="width:48%">
        <input type="number" id="prixR" placeholder="Prix Réduction" style="width:48%"><br><br>
        <button onclick="publierArticle()" style="width:100%; padding:10px; background:#007bff; color:white; border:none;">PUBLIER MAINTENANT</button>
    </div>

    <div id="catalogue"></div>

</body>
</html>
