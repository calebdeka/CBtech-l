<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CB@Techno - Réparation Mobile, Studio & Import Chine</title>
    
    <link rel="manifest" href="/CBtech-l/manifest.json">
    <meta name="theme-color" content="#0a192f">
    <link rel="apple-touch-icon" href="icon-192.png">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary: #0a192f;
            --secondary: #64ffda;
            --accent: #ff6b35;
            --purple: #bd34fe;
            --gold: #ffd700;
            --light: #f8f9fa;
            --dark: #020c1b;
            --glass: rgba(10, 25, 47, 0.95);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Poppins', sans-serif; background: var(--dark); color: var(--light); overflow-x: hidden; padding-top: 80px; }
        
        /* Style du bouton d'installation */
        #installArea {
            display: none; 
            text-align: center; 
            margin: 20px auto; 
            padding: 15px;
            max-width: 500px;
        }

        .btn-install {
            background-color: var(--secondary);
            color: var(--primary);
            padding: 18px 30px;
            border: none;
            border-radius: 50px;
            font-weight: bold;
            font-size: 1.1rem;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(100, 255, 218, 0.2);
            transition: transform 0.3s;
            width: 100%;
        }

        .btn-install:hover { transform: scale(1.02); }

        /* Le reste de ton CSS existant (simplifié pour l'exemple) */
        nav { background: var(--glass); padding: 1rem 5%; position: fixed; width: 100%; top: 0; z-index: 1000; border-bottom: 1px solid rgba(100, 255, 218, 0.1); }
        .nav-container { max-width: 1400px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 1.8rem; font-weight: 700; color: var(--secondary); text-decoration: none; }
        .hero { padding: 4rem 5%; text-align: center; }
        .hero h1 { font-size: 3rem; margin-bottom: 1rem; }
        .hero h1 span { color: var(--secondary); }
    </style>
</head>
<body>

    <nav>
        <div class="nav-container">
            <a href="#" class="logo"><i class="fas fa-mobile-alt"></i> CB@Techno</a>
        </div>
    </nav>

    <div id="installArea">
        <button id="installBtn" class="btn-install">
            <i class="fas fa-download"></i> INSTALLER L'APPLICATION
        </button>
        <p style="font-size: 0.8rem; margin-top: 10px; color: var(--secondary); opacity: 0.8;">
            Accédez à nos services en un clic depuis votre écran d'accueil
        </p>
    </div>

    <section class="hero">
        <div class="hero-content">
            <div class="hero-text">
                <h1>Expertise Mobile & <span>Import Chine</span></h1>
                <p>Réparation pro, Studio photo/vidéo et logistique Import-Export.</p>
            </div>
        </div>
    </section>

    <script>
        // 1. Enregistrement du Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/CBtech-l/sw.js')
                    .then(reg => console.log('App CBtech prête !'))
                    .catch(err => console.log('Erreur SW:', err));
            });
        }

        // 2. Logique du bouton d'installation
        let deferredPrompt;
        const installArea = document.getElementById('installArea');
        const installBtn = document.getElementById('installBtn');

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault(); // Empêche la barre Chrome par défaut
            deferredPrompt = e; // On garde l'événement en mémoire
            installArea.style.display = 'block'; // On montre notre bouton
        });

        installBtn.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt(); // Affiche la fenêtre d'installation
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') {
                    installArea.style.display = 'none';
                }
                deferredPrompt = null;
            }
        });

        window.addEventListener('appinstalled', () => {
            installArea.style.display = 'none';
            console.log('CB@Techno installée !');
        });
    </script>
</body>
</html>
