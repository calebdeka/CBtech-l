<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CB@Techno - Boutique & Filtres</title>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, query, onSnapshot, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAtTog9eMM3acErQeTf6K2gGrMcY3HBSnE",
            authDomain: "cbtech-database.firebaseapp.com",
            projectId: "cbtech-database",
            storageBucket: "cbtech-database.firebasestorage.app",
            messagingSenderId: "433087349101",
            appId: "1:433087349101:web:ee238334fd40ba2ab71a64"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const storage = getStorage(app);

        // --- PUBLICATION AVEC CATÉGORIE ---
        window.publierArticle = async () => {
            const pass = prompt("Code propriétaire :");
            if (pass !== "Caleb.1997") return alert("Accès refusé");

            const file = document.getElementById('file').files[0];
            const nom = document.getElementById('nom').value;
            const cate = document.getElementById('cate').value;
            const prixR = document.getElementById('prixR').value;

            if(!file || !nom || !prixR) return alert("Remplis les champs obligatoires !");

            try {
                const storageRef = ref(storage, 'articles/' + Date.now() + "_" + file.name);
                await uploadBytes(storageRef, file);
                const url = await getDownloadURL(storageRef);

                await addDoc(collection(db, "articles"), {
                    nom, cate, url, 
                    desc: document.getElementById('desc').value,
                    prixN: document.getElementById('prixN').value,
                    prixR: prixR,
                    date: Date.now()
                });
                alert("Publié !");
                document.getElementById('admin-panel').style.display = 'none';
            } catch (e) { alert("Erreur Firebase : Vérifie l'activation du Storage."); }
        };

        // --- FILTRAGE DES ARTICLES ---
        window.filtrer = (categorie) => {
            const cards = document.querySelectorAll('.card-dynamique');
            cards.forEach(card => {
                if(categorie === 'Tous' || card.getAttribute('data-cate') === categorie) {
                    card.style.display = 'block';
                } else { card.style.display = 'none'; }
            });
        };

        onSnapshot(query(collection(db, "articles"), orderBy("date", "desc")), (snap) => {
            const container = document.getElementById('nouveautes');
            container.innerHTML = "";
            snap.forEach(doc => {
                const d = doc.data();
                container.innerHTML += `
                    <div class="card card-dynamique" data-cate="${d.cate}">
                        <img src="${d.url}">
                        <div class="info">
                            <span class="badge">${d.cate}</span>
                            <h3>${d.nom}</h3>
                            <p class="prix"><del>${d.prixN} CFA</del> <span>${d.prixR} CFA</span></p>
                            <a href="https://wa.me/22870062639?text=Salut Caleb, je veux : ${d.nom}" class="btn-wa">Commander</a>
                        </div>
                    </div>`;
            });
        });
    </script>
    <style>
        body { font-family: sans-serif; margin: 0; background: #f0f2f5; }
        header { background: #000; color: #fff; padding: 20px; text-align: center; }
        .nav-filtres { display: flex; overflow-x: auto; padding: 10px; background: #fff; gap: 10px; border-bottom: 1px solid #ddd; }
        .btn-filtre { padding: 8px 15px; border-radius: 20px; border: 1px solid #000; background: none; white-space: nowrap; cursor: pointer; }
        .btn-filtre:hover { background: #000; color: #fff; }
        
        #admin-panel { display: none; background: #fff; padding: 15px; border-bottom: 3px solid #007bff; }
        input, select, textarea { width: 100%; padding: 10px; margin: 5px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        
        .container { padding: 10px; max-width: 600px; margin: auto; }
        .card { background: #fff; border-radius: 10px; overflow: hidden; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .card img { width: 100%; }
        .card .info { padding: 15px; }
        .badge { background: #007bff; color: white; padding: 3px 8px; border-radius: 5px; font-size: 10px; text-transform: uppercase; }
        .prix span { color: #e41e31; font-weight: bold; font-size: 1.2em; }
        .btn-wa { display: block; background: #25D366; color: white; text-align: center; padding: 12px; text-decoration: none; border-radius: 5px; font-weight: bold; }
    </style>
</head>
<body>

    <header>
        <h1>CB@Techno</h1>
        <button onclick="document.getElementById('admin-panel').style.display='block'" style="background:none; border:none; color: #666; font-size:10px;">Admin</button>
    </header>

    <div class="nav-filtres">
        <button class="btn-filtre" onclick="filtrer('Tous')">Tous</button>
        <button class="btn-filtre" onclick="filtrer('Écrans')">Écrans</button>
        <button class="btn-filtre" onclick="filtrer('Batteries')">Batteries</button>
        <button class="btn-filtre" onclick="filtrer('Audio')">Audio</button>
        <button class="btn-filtre" onclick="filtrer('Réparation')">Réparations</button>
    </div>

    <div id="admin-panel">
        <input type="file" id="file" accept="image/*">
        <input type="text" id="nom" placeholder="Nom du produit">
        <select id="cate">
            <option value="Écrans">Écrans</option>
            <option value="Batteries">Batteries</option>
            <option value="Audio">Audio</option>
            <option value="Réparation">Service Réparation</option>
        </select>
        <textarea id="desc" placeholder="Caractéristiques"></textarea>
        <input type="number" id="prixN" placeholder="Prix Normal">
        <input type="number" id="prixR" placeholder="Prix Promo">
        <button onclick="publierArticle()" style="width:100%; padding:15px; background:#007bff; color:white; border:none; border-radius:5px;">PUBLIER L'ARTICLE</button>
        <button onclick="document.getElementById('admin-panel').style.display='none'" style="width:100%; background:none; border:none; color:red; margin-top:10px;">Fermer</button>
    </div>

    <div class="container" id="nouveautes">
        </div>

</body>
</html>
